apiVersion: v1
kind: Secret
metadata:
  name: timescaledb-secret
  namespace: default
type: Opaque
data:
  # Base64 encoded credentials
  # Replace with your actual base64 encoded credentials
  # echo -n "your_username" | base64
  # echo -n "your_password" | base64
  username: eW91cl91c2VybmFtZQ==  # your_username (base64 encoded)
  password: eW91cl9wYXNzd29yZA==  # your_password (base64 encoded)
---
# Alternative: Use stringData for plain text (K8s will encode automatically)
apiVersion: v1
kind: Secret
metadata:
  name: timescaledb-secret-plain
  namespace: default
type: Opaque
stringData:
  username: "your_username"  # Replace with actual username
  password: "your_password"  # Replace with actual password
  jdbc-url: "jdbc:postgresql://your-timescaledb-host:5432/your_database"