apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-config
  namespace: default
data:
  connect-distributed.properties: |
    # Kafka Connect distributed worker configuration for 3-pod Kafka cluster
    bootstrap.servers=kafka-broker-pod0:9092,kafka-broker-pod1:9092,kafka-broker-pod2:9092
    
    # Connector configuration storage topics
    config.storage.topic=kafka-connect-configs
    offset.storage.topic=kafka-connect-offsets
    status.storage.topic=kafka-connect-status
    
    # Replication factors for 3-broker cluster
    config.storage.replication.factor=3
    offset.storage.replication.factor=3
    status.storage.replication.factor=3
    
    # Connect worker settings
    group.id=kafka-connect-cluster
    key.converter=org.apache.kafka.connect.storage.StringConverter
    value.converter=org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable=false
    
    # Internal converters
    internal.key.converter=org.apache.kafka.connect.json.JsonConverter
    internal.value.converter=org.apache.kafka.connect.json.JsonConverter
    internal.key.converter.schemas.enable=false
    internal.value.converter.schemas.enable=false
    
    # Plugin path for connectors
    plugin.path=/usr/share/java,/usr/share/confluent-hub-components,/opt/connectors
    
    # REST API configuration
    rest.port=8083
    rest.advertised.host.name=kafka-connect
    
    # Producer/Consumer configuration for 3-broker cluster
    producer.bootstrap.servers=kafka-broker-pod0:9092,kafka-broker-pod1:9092,kafka-broker-pod2:9092
    consumer.bootstrap.servers=kafka-broker-pod0:9092,kafka-broker-pod1:9092,kafka-broker-pod2:9092
    
    # Session configuration
    session.timeout.ms=30000
    heartbeat.interval.ms=3000
    
    # Logging
    log4j.root.loglevel=INFO
    
    # Performance tuning for production
    offset.flush.interval.ms=10000
    offset.flush.timeout.ms=5000
    
  log4j.properties: |
    log4j.rootLogger=INFO, stdout
    log4j.appender.stdout=org.apache.log4j.ConsoleAppender
    log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
    log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n
    
    # Reduce logging for noisy components
    log4j.logger.org.apache.kafka.connect.runtime.rest=WARN
    log4j.logger.org.reflections=ERROR
    log4j.logger.org.apache.kafka.clients=WARN